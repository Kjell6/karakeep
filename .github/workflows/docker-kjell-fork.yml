name: Build and Push Kjell Fork Docker Images
on:
  push:
    branches:
      - kjell/custom
    tags:
      - 'kjell-*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        image: [web, workers, cli, mcp, aio]
        include:
          - platform: linux/amd64
            suffix: amd64
            os: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            os: ubuntu-24.04-arm
          - image: web
            name: karakeep-web
            target: web
          - image: workers
            name: karakeep-workers
            target: workers
          - image: cli
            name: karakeep-cli
            target: cli
          - image: mcp
            name: karakeep-mcp
            target: mcp
          - image: aio
            name: karakeep-aio
            target: aio
    runs-on: ${{ matrix.os }}
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Github Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        run: |
          set -euo pipefail
          
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="ghcr.io/${REPO_OWNER}/${{ matrix.name }}"
          
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/kjell-* ]]; then
            TAG="${{ github.ref_name }}"
            all_tags="${IMAGE_BASE}:${TAG}-${{ matrix.suffix }},${IMAGE_BASE}:latest-${{ matrix.suffix }}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            # Push on kjell/custom branch
            TAG="kjell-$(date +%Y%m%d-%H%M%S)"
            all_tags="${IMAGE_BASE}:${TAG}-${{ matrix.suffix }},${IMAGE_BASE}:latest-${{ matrix.suffix }}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi
          
          echo "all=${all_tags}" >> "$GITHUB_OUTPUT"
          echo "Building tags: ${all_tags}"

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: SERVER_VERSION=${{ steps.tags.outputs.tag }}
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.all }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [karakeep-web, karakeep-workers, karakeep-cli, karakeep-mcp, karakeep-aio]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Github Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest for ${{ matrix.image }}
        run: |
          set -euo pipefail
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_OWNER}/${{ matrix.image }}"
          
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            "${IMAGE}:latest-amd64" \
            "${IMAGE}:latest-arm64"
          
          echo "Created multi-arch manifest for ${IMAGE}:latest"
